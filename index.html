<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Quran API</title>
</head>

<body>
    <main>
        <h1>Quranify</h1>
        <div>
            <div>
                <label for="surah">Chapter Number:</label>
                <input type="text" id="surah" placeholder="Enter a Chapter Number">
            </div>

            <div class="input">
                <label for="verse">Verse Number:</label>
                <input type="text" id="verse" placeholder="Enter a Verse Number">
            </div>
            <div class="search">
                <button>Search</button>
            </div>
            
        </div>

        <h3></h3>
        <h3 id="ayah"></h3>

        <audio src=""></audio>
        <p></p>
        <div class="sound">
            <button id="play"><i class="fa-solid fa-circle-play"></i> </button>
            <button id="stop"><i class="fa-solid fa-pause"></i> </button>
        </div>
    </main>
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
